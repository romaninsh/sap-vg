# Throwaway PostgreSQL for bench/bench.py. Not part of the app's stack (composer.yaml).
# The script starts and stops it: docker compose -p erp-bench -f bench/compose.yaml up -d
services:
  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30
