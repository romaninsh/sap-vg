# yaml-language-server: $schema=./table-schema-1.json
# Issuing books the receivable; voiding reverses it (tests/schema.surql). Paid/overdue are derived, never stored.
datasource: surrealdb
title: Invoices
columns:
  id: { type: string, flags: [id] }
  number: { type: string, label: Invoice, flags: [title, searchable] }
  customer: { type: string, label: Customer, flags: [mandatory], references: { table: customer, kind: has_one, name: customer } }
  customer.name: { type: string, label: Customer }
  sales_order: { type: string, label: Sales order, references: { table: sales_order, kind: has_one, name: sales_order } }
  sales_order.number: { type: string, label: Sales order }
  issued_on: { type: date, label: Issued }
  due_on: { type: date, label: Due }
  amount: { type: int, label: Amount, unit: { currency: "$", minor_units: true } }
  status: { type: string, label: Status, enum: [draft, issued, void] }
  # paid_amount is kept by the database as payments arrive (payments are immutable); the rest derive from it.
  paid: { type: int, label: Paid, unit: { currency: "$", minor_units: true }, expr: 'surreal::expr("paid_amount")' }
  outstanding: { type: int, label: Outstanding, unit: { currency: "$", minor_units: true },
                 expr: 'surreal::expr("IF status = ''issued'' THEN amount - paid_amount ELSE 0 END")' }
  state: { type: string, label: Payment,
           expr: 'surreal::expr("IF status != ''issued'' THEN status ELSE IF amount - paid_amount <= 0 THEN ''paid'' ELSE IF due_on < time::floor(time::now(), 1d) THEN ''overdue'' ELSE ''open'' END")' }
  days_overdue: { type: int, label: Days overdue,
                  expr: 'surreal::expr("IF status = ''issued'' AND due_on < time::floor(time::now(), 1d) AND amount > paid_amount THEN duration::days(time::floor(time::now(), 1d) - time::floor(due_on, 1d)) ELSE 0 END")' }
  # Sortable copy of the customer's name (a dotted column can't be ordered by).
  customer_name: { type: string, flags: [hidden], expr: 'surreal::expr("customer.name")' }
  deps_last_updated: { type: timestamp, flags: [hidden] }
references:
  payments: { table: payment, kind: has_many, foreign_key: invoice }
