# yaml-language-server: $schema=./table-schema-1.json
# Chart of accounts. Balance = debits − credits of posted entries (assets and expenses carry debit balances).
datasource: surrealdb
title: Chart of accounts
columns:
  id: { type: string, flags: [id] }
  code: { type: string, label: Account, flags: [mandatory, searchable] }
  name: { type: string, label: Name, flags: [mandatory, title, searchable] }
  kind: { type: string, label: Type, enum: [asset, liability, equity, revenue, expense] }
  debits: { type: int, label: Debits, unit: { currency: "$", minor_units: true },
            expr: 'surreal::expr("math::sum(<~journal_line[WHERE entry.status = ''posted''].debit)")' }
  credits: { type: int, label: Credits, unit: { currency: "$", minor_units: true },
             expr: 'surreal::expr("math::sum(<~journal_line[WHERE entry.status = ''posted''].credit)")' }
  balance: { type: int, label: Balance, unit: { currency: "$", minor_units: true },
             expr: 'surreal::expr("(IF kind INSIDE [''asset'', ''expense''] THEN 1 ELSE -1 END) * (math::sum(<~journal_line[WHERE entry.status = ''posted''].debit) - math::sum(<~journal_line[WHERE entry.status = ''posted''].credit))")' }
references:
  lines: { table: journal_line, kind: has_many, foreign_key: account }
