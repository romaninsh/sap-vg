# yaml-language-server: $schema=./action-schema-1.json
# Customer receipt against one invoice. The caller writes the payment row (bank transfer unless card is ticked).
kind: form
dialog:
  title: "Payment for ${row.number}"
  description: "Amount in dollars, prefilled with what is still owed. Recording it also books it in the ledger."
  confirm_label: Record payment
form:
  fields:
    - { name: amount, type: float, label: "Amount ($)" }
    - { name: paid_on, type: date, label: Received on, required: false, placeholder: "today (YYYY-MM-DD)" }
    - { name: by_card, type: bool, label: Paid by card, required: false, default: "false" }
